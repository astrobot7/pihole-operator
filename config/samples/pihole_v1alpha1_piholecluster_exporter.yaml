# Example: per-replica query metrics through an exporter sidecar.
# Not part of the default samples kustomization.
apiVersion: pihole.io/v1alpha1
kind: PiholeCluster
metadata:
  name: home
spec:
  replicas: 2
  podTemplate:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9617"
    spec:
      containers:
        - name: exporter
          image: ekofr/pihole-exporter:v1.0.0
          env:
            - name: PIHOLE_HOSTNAME
              value: 127.0.0.1
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-admin   # generated by the operator
                  key: password
          ports:
            - name: metrics
              containerPort: 9617
